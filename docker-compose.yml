services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/uploads
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3307}
      - DB_USER=${DB_USER:-fsi}
      - DB_PASSWORD=${DB_PASSWORD:-fsi_password}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-fsi_buchhaltung}
      - DB_CONN_LIMIT=${DB_CONN_LIMIT:-5}
      - UPLOAD_DIR=/uploads
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-5}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-fsi_session}
      - SESSION_SECRET=${SESSION_SECRET:-dev_change_me}
      - SESSION_INACTIVITY_MINUTES=${SESSION_INACTIVITY_MINUTES:-30}
      - SESSION_MAX_AGE_MINUTES=${SESSION_MAX_AGE_MINUTES:-1440}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - APP_BASE_URL=${APP_BASE_URL:-/}
    ports:
      - "3002:3002"
    command: sh -c "npm ci && node scripts/migrate-event-cost-centre-splits.mjs && node scripts/migrate-invoice-paid-at.mjs && npm run setup:audit && node scripts/seed-admin.mjs && npm run build && node .output/server/index.mjs"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: ["mariadbd", "--port=3307"]
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MARIADB_DATABASE=${DB_NAME:-fsi_buchhaltung}
      - MARIADB_USER=${DB_USER:-fsi}
      - MARIADB_PASSWORD=${DB_PASSWORD:-fsi_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3308:3307"
    healthcheck:
      test: ["CMD", "mariadb", "-u", "${DB_USER:-fsi}", "-p${DB_PASSWORD:-fsi_password}", "-h", "localhost", "-P", "3307", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  node_modules:
